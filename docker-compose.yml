services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-babi}
      POSTGRES_USER: ${POSTGRES_USER:-babi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]
  api:
    build: ./services/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-babi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-babi}?sslmode=disable
      API_ADDR: :8080
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BABI_API_URL: http://api:8080
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_started}
    networks: [internal]
volumes:
  postgres_data:
networks:
  internal:
    driver: bridge
