<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B.A.B.I</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#0c1220;color:#eaf0ff}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px;border-bottom:1px solid #2b3952;display:flex;justify-content:space-between}main{max-width:1100px;margin:auto;padding:32px 18px}.muted{color:#9baac5;font-size:13px}.grid{display:grid;grid-template-columns:270px 1fr;gap:18px}.panel{border:1px solid #2b3952;background:#141e31;padding:20px;border-radius:14px;min-width:0}input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #3c4a63;background:#0b1424;color:white}textarea{height:320px;font:13px/1.5 monospace;resize:vertical}button{background:#4c64d1;border:0;border-radius:8px;color:white;padding:10px 13px;cursor:pointer}button.item{display:block;width:100%;margin:7px 0;text-align:left;background:#253650}button.active{background:#425db2}.row{display:flex;gap:8px;margin:12px 0}.row input{flex:1;min-width:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a1424;padding:14px;border-radius:8px}#notice{min-height:22px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style></head><body><header><strong>B.A.B.I</strong><span class="muted">Local-first MVP</span></header><main><h1>Testing workspace</h1><p class="muted">Project → Test Case → Script → Run → Report</p><div class="grid"><aside class="panel"><h3>Projects</h3><div class="row"><input id="projectName" placeholder="Nama project"><button id="addProject">Tambah</button></div><div id="projects"></div></aside><section class="panel"><h2 id="heading">Pilih project</h2><div id="detail" hidden><div class="row"><input id="caseName" placeholder="Nama test case"><button id="addCase">Tambah</button></div><div id="cases"></div><div id="editor" hidden><h3 id="caseHeading"></h3><textarea id="script" spellcheck="false"></textarea><div class="row"><button id="save">Simpan script</button><button id="run">Run test</button></div></div><h3>Reports</h3><div id="reports" class="muted"></div></div><p id="notice" class="muted" role="status"></p></section></div></main><script>
let w={projects:[],runs:[]},projectId='',caseId='';const $=id=>document.getElementById(id),node=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined}),v=await r.json();if(!r.ok)throw Error(v.error);return v}const project=()=>w.projects.find(x=>x.id===projectId);async function refresh(){w=await api('workspace');render()}function render(){const list=$('projects');list.replaceChildren();for(const p of w.projects){const b=node('button',p.name);b.className='item'+(p.id===projectId?' active':'');b.onclick=()=>{projectId=p.id;caseId='';render()};list.append(b)}const p=project();$('detail').hidden=!p;$('heading').textContent=p?.name||'Pilih project';if(!p)return;const cases=$('cases');cases.replaceChildren();for(const c of p.cases){const b=node('button',c.title);b.className='item'+(c.id===caseId?' active':'');b.onclick=()=>{caseId=c.id;render()};cases.append(b)}const c=p.cases.find(x=>x.id===caseId);$('editor').hidden=!c;if(c){$('caseHeading').textContent=c.title;$('script').value=c.script}const reports=$('reports');reports.replaceChildren();const runs=w.runs.filter(x=>x.projectId===p.id);if(!runs.length)reports.textContent='Belum ada hasil';for(const r of runs){const d=document.createElement('details');d.append(node('summary',r.title+' — '+r.status),node('pre',r.output||'No output'));reports.append(d)}}async function action(fn){try{await fn();await refresh();$('notice').textContent='Selesai'}catch(e){$('notice').textContent=e.message}}$('addProject').onclick=()=>action(async()=>{const p=await api('projects',{name:$('projectName').value});projectId=p.id;caseId='';$('projectName').value=''});$('addCase').onclick=()=>action(async()=>{const c=await api('cases',{projectId,title:$('caseName').value});caseId=c.id;$('caseName').value=''});$('save').onclick=()=>action(()=>api('cases/update',{projectId,caseId,script:$('script').value}));$('run').onclick=()=>action(async()=>{if(!confirm('Jalankan kode ini di komputer lokal? Pastikan script terpercaya.'))return;await api('cases/update',{projectId,caseId,script:$('script').value});$('notice').textContent='Running...';await api('run',{projectId,caseId})});refresh().catch(e=>$('notice').textContent=e.message);
</script></body></html>
